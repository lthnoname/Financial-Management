spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/finance_db
    username: admin
    password: local_password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  server:
    port: 8080
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-do-not-use-in-production}
    expiration: 86400000
