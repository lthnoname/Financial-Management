spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financial_management}
    username: ${SPRING_DATASOURCE_USERNAME:financial_app}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  server:
    port: 8080
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-do-not-use-in-production}
    expiration: 86400000
